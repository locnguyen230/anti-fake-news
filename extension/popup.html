<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Anti Fake News</title>
  <link rel="stylesheet" href="styles/popup.css">
  <script type="module" src="popup.js"></script>
</head>
<body>
  <main>
    <h1>Anti Fake News</h1>

    <div aria-live="polite" aria-atomic="true">
      <p id="status"></p>
      <div id="prediction" hidden>
        <p class="score-label">fake_score</p>
        <p id="score"></p>
        <p id="verdict"></p>
        <p id="context" hidden></p>
      </div>
    </div>

    <button id="predict" type="button" disabled>Phân tích</button>
  </main>
</body>
</html>
