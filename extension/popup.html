<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Anti Fake News</title>
  <link rel="stylesheet" href="styles/popup.css">
  <script type="module" src="popup.js"></script>
</head>
<body>
  <main>
    <h1>Anti Fake News</h1>

    <div aria-live="polite" aria-atomic="true">
      <p id="status"></p>
      <div id="prediction" hidden>
        <p class="score-label">fake_score</p>
        <p id="score"></p>
        <p id="verdict"></p>
        <p id="context" hidden></p>
      </div>
    </div>

    <form id="connection" novalidate>
      <button id="predict" type="submit" disabled>Phân tích</button>
      <details id="settings">
        <summary>Kết nối Backend</summary>
        <label for="endpoint">Địa chỉ Backend</label>
        <input id="endpoint" type="url" value="http://127.0.0.1:8000" autocomplete="off">
        <label for="demo-token">Token demo</label>
        <input id="demo-token" type="password" autocomplete="off">
        <label for="timeout">Thời gian chờ (ms)</label>
        <input id="timeout" type="number" value="30000" min="1000" max="120000" step="1">
      </details>
    </form>
    <button id="manual" type="button" disabled>Phân tích thủ công</button>
  </main>
</body>
</html>
